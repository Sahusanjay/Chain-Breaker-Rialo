<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Chain Breaker - Rialo Game</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #111;
      color: #fff;
      font-family: Arial, sans-serif;
      text-align: center;
    }
    #score {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 24px;
      font-weight: bold;
    }
    canvas {
      display: block;
      margin: auto;
      background: #222;
      border: 2px solid #555;
    }
  </style>
</head>
<body>
  <div id="score">Score: 0</div>
  <canvas id="gameCanvas" width="400" height="600"></canvas>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    let score = 0;
    let chains = [];
    let gameOver = false;

    // Load logos
    const rialoLogo = new Image();
    rialoLogo.src = "assets/rialo.png";   // <-- Rialo logo (PNG)

    const myLogo = new Image();
    myLogo.src = "assets/mylogo.jpeg";    // <-- Your logo (JPEG)

    class Chain {
      constructor(x, y, speed) {
        this.x = x;
        this.y = y;
        this.width = 60;
        this.height = 20;
        this.speed = speed;
        this.broken = false;
      }
      update() {
        this.y += this.speed;
        if (this.y > canvas.height && !this.broken) {
          gameOver = true;
        }
      }
      draw() {
        ctx.fillStyle = this.broken ? "green" : "gray";
        ctx.fillRect(this.x, this.y, this.width, this.height);
        ctx.strokeStyle = "black";
        ctx.strokeRect(this.x, this.y, this.width, this.height);
      }
    }

    function spawnChain() {
      const x = Math.random() * (canvas.width - 60);
      const speed = 2 + Math.random() * 2;
      chains.push(new Chain(x, 0, speed));
    }

    canvas.addEventListener("click", (e) => {
      const rect = canvas.getBoundingClientRect();
      const mouseX = e.clientX - rect.left;
      const mouseY = e.clientY - rect.top;

      chains.forEach((chain) => {
        if (
          mouseX >= chain.x &&
          mouseX <= chain.x + chain.width &&
          mouseY >= chain.y &&
          mouseY <= chain.y + chain.height &&
          !chain.broken
        ) {
          chain.broken = true;
          score += 10;
          document.getElementById("score").innerText = "Score: " + score;
        }
      });
    });

    function drawLogos() {
      if (rialoLogo.complete) {
        ctx.drawImage(rialoLogo, 10, 10, 60, 60);
      }
      if (myLogo.complete) {
        ctx.drawImage(myLogo, canvas.width - 70, 10, 60, 60);
      }
    }

    function gameLoop() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      if (gameOver) {
        ctx.fillStyle = "red";
        ctx.font = "30px Arial";
        ctx.fillText("Game Over!", canvas.width / 2 - 80, canvas.height / 2);
        return;
      }

      chains.forEach((chain) => {
        chain.update();
        chain.draw();
      });

      drawLogos();

      requestAnimationFrame(gameLoop);
    }

    // Spawn chains every 1 second
    setInterval(() => {
      if (!gameOver) spawnChain();
    }, 1000);

    gameLoop();
  </script>
</body>
</html>
